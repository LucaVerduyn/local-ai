name: Bug report
description: Report a problem with Local AI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Local AI.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS / Ubuntu
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Local AI 1.0.0, Python 3.13, Ollama 0.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log excerpts (no personal documents).
